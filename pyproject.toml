[project]
name = "miraeasset-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "flagembedding>=1.4.0",
    "langchain>=1.3.14",
    "langchain-naver>=0.1.1",
    "langgraph>=1.2.10",
    "neo4j>=6.2.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "torch==2.13.0+cu130",
    "transformers>=5.15.0",
    "typing>=3.10.0.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

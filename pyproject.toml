[project]
name = "miraeasset-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "neo4j>=6.2.0",
    "python-dotenv>=1.2.2",
    "typing>=3.10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"

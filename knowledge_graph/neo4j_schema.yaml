schema_version: "1.1.0"

metadata:
  description: Neo4j 적재 코드가 사용하는 목표 스키마
  notes:
    - nullable하거나 존재하지 않을 수 있는 속성은 type 뒤에 ?로 표기
    - Text와 Table은 Evidence 공통 label을 함께 갖는 subtype
    - 복합 label은 Evidence:Text와 Evidence:Table 형식으로 표기

entities:
  Company:
    labels:
      - Company
    description: 공시 발행회사
    properties:
      corp_code:
        type: string
        description: DART 고유 회사 코드
      stock_code:
        type: string?
        description: 종목 코드
      corp_name:
        type: string?
        description: 회사 한글명
      corp_eng_name:
        type: string?
        description: 회사 영문명
      market:
        type: string?
        description: 상장 시장
      industry:
        type: string?
        description: 산업 분류
      sector:
        type: string?
        description: 세부 업종
      listing_date:
        type: date?
        description: 상장일
      market_cap:
        type: integer?
        description: 시가총액

  Disclosure:
    labels:
      - Disclosure
    description: 공시 문서
    properties:
      id:
        type: string
        description: 공시 고유 ID
      doc_group:
        type: string
        values:
          - exchange
          - holding
          - major
          - periodic
        description: 공시 문서 유형
      source_path:
        type: string
        description: 공시 원문 데이터 상대 경로
      report_name:
        type: string
        description: 공시 보고서명
      rcept_date:
        type: date
        description: 공시 접수일
      n_sections:
        type: integer
        description: 연결된 전체 Section 수

  Section:
    labels:
      - Section
    description: 공시 문서 내부 구획
    properties:
      id:
        type: string
        description: Section 고유 ID
      title:
        type: string?
        description: Section 제목
      section_path:
        type: list[string]
        description: 상위 제목을 포함한 계층 경로
      element_path:
        type: string?
        description: 원문 내 element 경로
      order_in_doc:
        type: integer
        description: 문서 내 등장 순서
      n_evidence:
        type: integer
        description: 직접 연결된 Evidence 수

  Evidence:
    labels:
      - Evidence
    abstract: true
    description: Text와 Table의 공통 base label
    properties:
      id:
        type: string
        description: Evidence 고유 ID
      order_in_section:
        type: integer
        description: Section 내 등장 순서
      heading_path:
        type: list[string]
        description: 소제목 문맥 경로

  Text:
    labels:
      - Evidence
      - Text
    extends: Evidence
    description: 텍스트 Evidence
    properties:
      text:
        type: string
        description: 추출 텍스트 원문

  Table:
    labels:
      - Evidence
      - Table
    extends: Evidence
    description: 표 Evidence
    properties:
      table_type:
        type: string
        values:
          - KV-table
          - R-table
        description: 표 구조 유형
      title:
        type: string?
        description: 표 제목
      captions:
        type: string?
        description: 표 캡션
      notes:
        type: list[string]
        description: 표 주석 목록
      units:
        type: list[string]
        description: 표 단위 목록
      headers:
        type: list[string]?
        applies_to: R-table
        description: flatten된 column header 목록
      n_rows:
        type: integer?
        applies_to: R-table
        description: row 수
      keys:
        type: list[string]?
        applies_to: KV-table
        description: flatten된 key 목록
      n_entries:
        type: integer?
        applies_to: KV-table
        description: key-value entry 수

relations:
  PUBLISHES:
    type: PUBLISHES
    description: 회사가 발행한 공시 연결
    endpoints:
      source:
        - Company
      target:
        - Disclosure
    properties: {}

  HAS_SECTION:
    type: HAS_SECTION
    description: 공시 또는 상위 Section의 하위 Section 연결
    endpoints:
      source:
        - Disclosure
        - Section
      target:
        - Section
    properties: {}

  HAS_EVIDENCE:
    type: HAS_EVIDENCE
    description: Section의 Text 또는 Table Evidence 연결
    endpoints:
      source:
        - Section
      target:
        - Evidence:Text
        - Evidence:Table
    properties: {}

constraints:
  - name: company_corp_code
    entity: node
    labels:
      - Company
    properties:
      - corp_code
    constraint_type: uniqueness
  - name: disclosure_id
    entity: node
    labels:
      - Disclosure
    properties:
      - id
    constraint_type: uniqueness
  - name: section_id
    entity: node
    labels:
      - Section
    properties:
      - id
    constraint_type: uniqueness
  - name: evidence_id
    entity: node
    labels:
      - Evidence
    properties:
      - id
    constraint_type: uniqueness

indexes:
  - name: company_corp_code
    index_type: range
    entity: node
    labels:
      - Company
    properties:
      - corp_code
    owned_by_constraint: company_corp_code
  - name: disclosure_id
    index_type: range
    entity: node
    labels:
      - Disclosure
    properties:
      - id
    owned_by_constraint: disclosure_id
  - name: section_id
    index_type: range
    entity: node
    labels:
      - Section
    properties:
      - id
    owned_by_constraint: section_id
  - name: evidence_id
    index_type: range
    entity: node
    labels:
      - Evidence
    properties:
      - id
    owned_by_constraint: evidence_id
  - name: index_460996c0
    index_type: lookup
    entity: node
    lookup_target: labels
  - name: index_1b9dcc97
    index_type: lookup
    entity: relationship
    lookup_target: relationship_type

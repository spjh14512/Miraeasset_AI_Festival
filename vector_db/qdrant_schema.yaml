schema_version: "qdrant-live-schema.v1"

# This file describes the collection observed directly from the local Qdrant
# instance. Runtime counts are a snapshot and are not schema constraints.
inspection:
  source: "Qdrant localhost instance"
  observed_on: "2026-08-24"
  collection_status: "green"
  optimizer_status: "ok"
  points_count: 28882
  indexed_vectors_count: 27980
  segments_count: 4
  point_kind_counts:
    TEXT: 14187
    KV_TABLE: 789
    R_TABLE: 13906

collection:
  name: "dart_evidence"
  shard_number: 1
  replication_factor: 1
  write_consistency_factor: 1
  on_disk_payload: true
  hnsw_config:
    m: 16
    ef_construct: 100
    full_scan_threshold: 10000
    max_indexing_threads: 0
    on_disk: false
  optimizer_config:
    deleted_threshold: 0.2
    vacuum_min_vector_number: 1000
    default_segment_number: 0
    indexing_threshold: 10000
    flush_interval_sec: 5
  wal_config:
    wal_capacity_mb: 32
    wal_segments_ahead: 0
    wal_retain_closed: 1
  quantization_config: null
  strict_mode_config: null

point:
  id:
    type: "uuid"
    required: true
    observed_version: 5
    policy: "uuid_v5"
    namespace: "9220d409-a029-5497-8ab2-fc39b239ab18"
    note: "Point UUID identity continues to use the Canonical source Evidence ID."
    identity_keys:
      TEXT: "{source_evidence_id}"
      KV_TABLE: "{source_evidence_id}"
      R_TABLE_WHOLE: "{source_evidence_id}"
      R_TABLE_DESCRIPTOR: "{source_evidence_id}:descriptor"
      R_TABLE_ROW_GROUP: "{source_evidence_id}:row_group:{row_start_index}:{row_end_index}"
  vectors:
    dense:
      name: "evidence_dense"
      dimension: 1024
      distance: "Cosine"
      required: true
      storage:
        on_disk: null
        datatype: null
        multivector: false
      embedding:
        model: "bge-m3"
        implementation: "FlagEmbedding.BGEM3FlagModel"
        source_field: "contextual_text"
        normalize_embeddings: true
        max_length: 3000
        batch_size: 32
        device: "cuda:0"
        source: "project configuration; embedding settings are not stored by Qdrant"

payload:
  required_fields:
    - "retrieval_metadata"
    - "contextual_text"
    - "canonical"
  fields:
    retrieval_metadata:
      type: "object"
      required: true
      fields:
        point_kind:
          type: "keyword"
          required: true
          nullable: false
          allowed_values: ["TEXT", "KV_TABLE", "R_TABLE"]
          payload_index: true
          index_path: "retrieval_metadata.point_kind"
        evidence_id:
          type: "keyword"
          required: true
          nullable: false
          format: "d{rcept_no}:src{source_index}:s{section_order}:e{evidence_order}"
          source_conversion: "replace the Canonical 'evidence:' prefix with 'd'"
          migration_verified_on: "2026-08-25"
          payload_index: true
          index_path: "retrieval_metadata.evidence_id"
          neo4j_entity: "Evidence"
          neo4j_property: "id"
        corp_name:
          type: "keyword"
          required: true
          nullable: false
          payload_index: true
          index_path: "retrieval_metadata.corp_name"
        corp_code:
          type: "keyword"
          required: true
          nullable: false
          payload_index: true
          index_path: "retrieval_metadata.corp_code"
          note: "String value preserves leading zeroes."
        industry:
          type: "keyword"
          required: true
          nullable: true
          observed_null_count: 0
          payload_index: true
          index_path: "retrieval_metadata.industry"
        sector:
          type: "keyword"
          required: true
          nullable: true
          observed_null_count: 0
          payload_index: true
          index_path: "retrieval_metadata.sector"
        report_nm:
          type: "text"
          required: true
          nullable: false
          payload_index: false
        base_year:
          type: "integer"
          required: true
          nullable: true
          observed_null_count: 788
          observed_range: [2023, 2026]
          payload_index: true
          index_path: "retrieval_metadata.base_year"
        base_month:
          type: "integer"
          required: true
          nullable: true
          minimum: 1
          maximum: 12
          observed_null_count: 788
          observed_range: [3, 12]
          payload_index: true
          index_path: "retrieval_metadata.base_month"
        table_id:
          type: "keyword"
          required: "R_TABLE only"
          nullable: false
          omitted_for: ["TEXT", "KV_TABLE"]
          observed_point_count: 13906
          payload_index: true
          index_path: "retrieval_metadata.table_id"
        row_start_index:
          type: "integer"
          required: "R_TABLE row-group only"
          nullable: false
          minimum: 0
          observed_point_count: 479
          payload_index: false
        row_end_index:
          type: "integer"
          required: "R_TABLE row-group only"
          nullable: false
          minimum: 0
          constraint: "row_end_index >= row_start_index"
          observed_point_count: 479
          payload_index: false
    contextual_text:
      type: "text"
      required: true
      nullable: false
      payload_index: false
      note: "Exact text used as the dense embedding input."
    canonical:
      type: "object"
      required: true
      nullable: false
      payload_index: false
      table_metadata:
        type: "object"
        required: false
        omission_policy: "Omitted when every table metadata field is empty."
        fields:
          title:
            type: "text"
            required: false
          captions:
            type: "list<text>"
            required: false
          units:
            type: "list<text>"
            required: false
          notes:
            type: "list<text>"
            required: false
      variants:
        TEXT:
          fields:
            text:
              type: "text"
              required: true
              nullable: false
        KV_TABLE:
          fields:
            table_metadata:
              reference: "payload.fields.canonical.table_metadata"
              required: false
            entries:
              type: "list<object>"
              required: true
              may_be_empty: true
              item_fields:
                key:
                  type: "text"
                  required: true
                  nullable: false
                value:
                  type: "text"
                  required: true
                  nullable: false
        R_TABLE:
          fields:
            table_metadata:
              reference: "payload.fields.canonical.table_metadata"
              required: false
            headers:
              type: "list<list<text>>"
              required: true
              nullable: false
            records:
              type: "list<object>"
              required: true
              nullable: false
              item_fields:
                record_index:
                  type: "integer"
                  required: true
                  minimum: 0
                values:
                  type: "list<text|null>"
                  required: true
          record_scope:
            whole_table: "all table records"
            descriptor: "all table records"
            row_group: "records in the inclusive row_start_index..row_end_index range"

# These are the nine payload indexes returned by Qdrant collection inspection.
payload_indexes:
  - path: "retrieval_metadata.point_kind"
    type: "keyword"
    indexed_points: 28882
  - path: "retrieval_metadata.evidence_id"
    type: "keyword"
    indexed_points: 28882
  - path: "retrieval_metadata.corp_name"
    type: "keyword"
    indexed_points: 28882
  - path: "retrieval_metadata.corp_code"
    type: "keyword"
    indexed_points: 28882
  - path: "retrieval_metadata.industry"
    type: "keyword"
    indexed_points: 28882
  - path: "retrieval_metadata.sector"
    type: "keyword"
    indexed_points: 28882
  - path: "retrieval_metadata.base_year"
    type: "integer"
    indexed_points: 28094
  - path: "retrieval_metadata.base_month"
    type: "integer"
    indexed_points: 28094
  - path: "retrieval_metadata.table_id"
    type: "keyword"
    indexed_points: 13906

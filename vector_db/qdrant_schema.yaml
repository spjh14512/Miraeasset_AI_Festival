schema_version: "qdrant-schema.v2"

# Target schema used by the Point builder and insertion code. This edit does not
# migrate or mutate an existing Qdrant collection.
deployment:
  live_payload_migrated: false
  note: "Existing Qdrant Points and payload indexes are intentionally unchanged."

collection:
  name: "dart_evidence"
  shard_number: 1
  replication_factor: 1
  write_consistency_factor: 1
  on_disk_payload: true

point:
  id:
    type: "uuid"
    required: true
    policy: "uuid_v5"
    namespace: "9220d409-a029-5497-8ab2-fc39b239ab18"
    note: "Point UUID identity uses the Canonical source Evidence ID."
    identity_keys:
      TEXT: "{source_evidence_id}"
      KV_TABLE: "{source_evidence_id}"
      R_TABLE_WHOLE: "{source_evidence_id}"
      R_TABLE_DESCRIPTOR: "{source_evidence_id}:descriptor"
      R_TABLE_ROW_GROUP: "{source_evidence_id}:row_group:{row_start_index}:{row_end_index}"
      R_TABLE_CANONICAL_CHUNK: "{parent_identity_key}:canonical_chunk:{partition_chunk_index}:{row_start_index}:{row_end_index}"
  vectors:
    dense:
      name: "evidence_dense"
      dimension: 1024
      distance: "Cosine"
      required: true
      embedding:
        model: "bge-m3"
        implementation: "FlagEmbedding.BGEM3FlagModel"
        source_field: "contextual_text"
        normalize_embeddings: true
        max_length: 3000
        batch_size: 32
        device: "cuda:0"
    sparse:
      name: "evidence_sparse"
      type: "sparse"
      required: true
      modifier: null
      embedding:
        model: "bge-m3"
        implementation: "FlagEmbedding.BGEM3FlagModel"
        output_field: "lexical_weights"
        source_field: "contextual_text"
        representation: "token ID indices with learned lexical weights"
        max_length: 3000
        batch_size: 32
        device: "cuda:0"
  hybrid_search:
    default: true
    dense_vector: "evidence_dense"
    sparse_vector: "evidence_sparse"
    fusion: "RRF"
    prefetch_limit_multiplier: 5
    note: "score_threshold applies to the fused RRF score, not the dense cosine score."
  canonical_chunking:
    applies_to: "R_TABLE"
    max_bytes: 32768
    indivisible_hard_max_bytes: 65536
    size_definition: "compact JSON serialized with ensure_ascii=false, UTF-8 bytes"
    boundary: "contiguous records; headers and non-empty table metadata repeat in every chunk"
    balancing: "minimum feasible chunk count with boundaries nearest the remaining average byte size"
    contextual_text:
      structured_numeric: "re-profile each chunk and build its descriptor independently"
      semantic_textual: "render the actual records contained in each chunk"

payload:
  required_fields:
    - "point_kind"
    - "disclosure_id"
    - "section_id"
    - "evidence_id"
    - "corp_name"
    - "report_name"
    - "section_name"
    - "rcept_date"
    - "contextual_text"
    - "canonical"
  fields:
    point_kind:
      type: "keyword"
      required: true
      nullable: false
      allowed_values: ["TEXT", "KV_TABLE", "R_TABLE"]
      payload_index: true
      index_path: "point_kind"
    disclosure_id:
      type: "keyword"
      required: true
      nullable: false
      format: "d{rcept_no}"
      derivation: "Evidence ID prefix before :src"
      payload_index: true
      index_path: "disclosure_id"
      neo4j_entity: "Disclosure"
      neo4j_property: "id"
    section_id:
      type: "keyword"
      required: true
      nullable: false
      format: "d{rcept_no}:src{source_index}:s{section_order}"
      derivation: "Evidence ID prefix before :e"
      payload_index: true
      index_path: "section_id"
      neo4j_entity: "Section"
      neo4j_property: "id"
    evidence_id:
      type: "keyword"
      required: true
      nullable: false
      format: "d{rcept_no}:src{source_index}:s{section_order}:e{evidence_order}"
      source_conversion: "replace the Canonical 'evidence:' prefix with 'd'"
      payload_index: true
      index_path: "evidence_id"
      neo4j_entity: "Evidence"
      neo4j_property: "id"
    corp_name:
      type: "keyword"
      required: true
      nullable: false
      payload_index: true
      index_path: "corp_name"
    report_name:
      type: "text"
      required: true
      nullable: false
      payload_index: false
    section_name:
      type: "text"
      required: true
      nullable: false
      construction: "section_path and Evidence heading_path joined with ' > '"
      payload_index: false
    rcept_date:
      type: "keyword"
      required: true
      nullable: false
      format: "YYYYMMDD"
      source_field: "manifest.rcept_dt"
      payload_index: true
      index_path: "rcept_date"
    contextual_text:
      type: "text"
      required: true
      nullable: false
      payload_index: false
      note: "Exact text used for both dense and lexical sparse embedding inputs."
    canonical:
      type: "object"
      required: true
      nullable: false
      payload_index: false
      variants:
        TEXT:
          fields:
            text: {type: "text", required: true}
        KV_TABLE:
          fields:
            table_metadata:
              type: "object"
              required: false
              omission_policy: "Omitted when every table metadata field is empty."
            entries:
              type: "list<object>"
              required: true
              item_fields:
                key: {type: "text", required: true}
                value: {type: "text", required: true}
        R_TABLE:
          fields:
            table_metadata:
              type: "object"
              required: false
              omission_policy: "Omitted when every table metadata field is empty."
            headers: {type: "list<list<text>>", required: true}
            records:
              type: "list<object>"
              required: true
              item_fields:
                record_index: {type: "integer", required: true, minimum: 0}
                values: {type: "list<text|null>", required: true}
    chunking:
      type: "object"
      required: false
      applies_when: "One R_TABLE produces two or more Points."
      omission_policy: "Omitted entirely for TEXT, KV_TABLE, and unchunked R_TABLE Points."
      fields:
        table_id:
          type: "keyword"
          required: true
          nullable: false
          payload_index: true
          index_path: "chunking.table_id"
        chunk_index:
          type: "integer"
          required: true
          minimum: 0
          numbering: "zero-based"
          payload_index: false
        chunk_count:
          type: "integer"
          required: true
          minimum: 2
          payload_index: false
        row_start_index:
          type: "integer"
          required: true
          minimum: 0
          payload_index: false
        row_end_index:
          type: "integer"
          required: true
          minimum: 0
          constraint: "row_end_index >= row_start_index"
          payload_index: false

# Indexes expected when a collection is initialized for this target schema.
# Existing live indexes are not changed by this schema-file edit.
payload_indexes:
  - {path: "point_kind", type: "keyword"}
  - {path: "disclosure_id", type: "keyword"}
  - {path: "section_id", type: "keyword"}
  - {path: "evidence_id", type: "keyword"}
  - {path: "corp_name", type: "keyword"}
  - {path: "rcept_date", type: "keyword"}
  - {path: "chunking.table_id", type: "keyword"}

schema_version: "qdrant-query-llm.v2"

purpose: >-
  Plan을 QdrantQuery로 변환하기 위한 LLM 전용 논리 schema입니다.
  Qdrant의 물리 payload 전체 구조가 아니라 LLM이 생성할 수 있는 출력만 정의합니다.

output_contract:
  mode:
    type: enum
    values: ["vector", "filter"]
    rules:
      vector: 의미 검색이 필요할 때 사용
      filter: 명시된 disclosure_id, section_id, evidence_id 또는 chunking.table_id로 조회할 때 사용
  query_text:
    type: "string | null"
    rules:
      vector: 비어 있지 않은 자연어 검색문 필수
      filter: 반드시 null
  query_vector:
    llm_output: forbidden
    reason: application이 query_text에서 BGE-M3 dense+sparse vector를 생성
  limit:
    llm_output: forbidden
    reason: Retriever가 retrieve_search의 argument로 지정
  filters:
    type: list[QdrantFilter]
    semantics: 모든 항목을 AND 조건으로 결합
    allowed_keys:
      disclosure_id:
        match_type: string
      section_id:
        match_type: string
      evidence_id:
        match_type: string
      rcept_date:
        match_type: string
        format: YYYYMMDD
        note: >-
          보고서 접수일 metadata입니다. 사용자 날짜 조건에는 최소 1개월 오차 범위가
          필요하므로 단일 날짜 exact match로 사용하지 않고, Neo4j에서 기간 범위를
          먼저 좁힌 dependency의 식별자를 사용하는 것을 우선합니다.
      chunking.table_id:
        match_type: string
        availability: 여러 Point로 청킹된 R_TABLE에만 존재
    condition_rules:
      - 하나의 filter에는 match만 사용하고 range는 사용하지 않음
      - match 값은 string scalar만 허용
      - match에 list, array, object를 사용하지 않음
      - 동일한 key의 filter를 여러 개 만들어 OR를 표현하지 않음
      - Plan에 명시된 조건만 filter로 변환
      - base_year와 base_month는 존재하지 않으므로 사용하지 않음
      - 날짜 조건을 단일 rcept_date exact match로 변환하지 않음
      - 날짜 검색에는 최소 1개월 오차 범위를 허용하고 Neo4j dependency를 우선 사용
      - 거래일·취득일·처분일 자체를 보고서 접수일로 단정하지 않음
      - corp_name은 filter로 사용하지 않고 필요한 표현을 query_text에 유지
  score_threshold:
    type: "number | null"
    range: [-1.0, 1.0]
    rules:
      vector: Plan에 threshold 요구가 없으면 null. 값은 dense cosine이 아닌 fused RRF score에 적용
      filter: 반드시 null

examples:
  - name: 특별관계자 목록 의미 검색
    output:
      mode: vector
      query_text: 삼성전자 특별관계자 명단 및 관계
      filters: []
      score_threshold: null
  - name: 공시 기준일을 포함한 의미 검색
    output:
      mode: vector
      query_text: 2024년 3월 전후 LG유플러스 사업보고서 연결 기준 유동자산 총액
      filters: []
      score_threshold: null
  - name: evidence_id 정확 조회
    output:
      mode: filter
      query_text: null
      filters:
        - key: evidence_id
          match: d20240306000686:src0:s27:e8
      score_threshold: null

invalid_example:
  output:
    filters:
      - key: corp_name
        match: 삼성전자
  violations:
    - corp_name은 허용된 filter key가 아님
